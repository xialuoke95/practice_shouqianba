apiVersion: batch/v1
kind: Job
metadata:
  name: qwen36-swift-r13-hf-export
  namespace: glm51-pd-b200-p1d1
  labels:
    app.kubernetes.io/name: qwen36-swift-r13-hf-export
    test-training.verdent.ai/purpose: megatron-to-hf-export
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: qwen36-swift-r13-hf-export
    spec:
      restartPolicy: Never
      nodeName: hyperpod-i-060621000d6270d47
      serviceAccountName: sglang-s3-access
      containers:
      - name: export
        image: 763104351884.dkr.ecr.us-east-2.amazonaws.com/pytorch-training:2.8.0-gpu-py312-cu129-ubuntu22.04-ec2-v1.39-soci
        imagePullPolicy: IfNotPresent
        command: ["/bin/bash", "-lc"]
        args:
        - |
          set -euxo pipefail
          CHECKPOINT_S3=s3://verdent.tech/test_training/sft_opus_sonnet_swift/qwen36-swift-fullsft-20260527-205700/training/qwen36_swift_all_full_r13/checkpoint_copy/
          EXPORT_S3=s3://verdent.tech/test_training/sft_opus_sonnet_swift/qwen36-swift-fullsft-20260527-205700/deployment_exports/qwen36_swift_all_full_r13_hf/
          LOCAL_CHECKPOINT=/host-nvme/test_training/qwen36_swift_r13_hf_export/checkpoint_copy
          LOCAL_HF_EXPORT=/host-nvme/test_training/qwen36_swift_r13_hf_export/hf_export
          LOCAL_ROOT=/host-nvme/test_training/qwen36_swift_r13_hf_export
          RUNTIME_RUN_DIR="${LOCAL_ROOT}/runtime_run"
          RUNTIME_NODE_ROOT="${LOCAL_ROOT}/runtime_node0"
          HF_MODEL_ID=Qwen/Qwen3.6-35B-A3B
          mkdir -p "${LOCAL_CHECKPOINT}" "${LOCAL_HF_EXPORT}" "${RUNTIME_RUN_DIR}/env" "${RUNTIME_NODE_ROOT}"
          aws s3 cp s3://verdent.tech/test_training/sft_opus_sonnet_swift/qwen36-swift-fullsft-20260527-205700/env/Megatron-Bridge-v0.4.1-source.tar.gz "${RUNTIME_RUN_DIR}/env/Megatron-Bridge-v0.4.1-source.tar.gz" --region "${AWS_REGION}"
          aws s3 cp s3://verdent.tech/test_training/sft_opus_sonnet_swift/qwen36-swift-fullsft-20260527-205700/artifacts/source/scripts/setup_aws_dlc_bridge_runtime.sh "${LOCAL_ROOT}/setup_aws_dlc_bridge_runtime.sh" --region "${AWS_REGION}"
          bash "${LOCAL_ROOT}/setup_aws_dlc_bridge_runtime.sh" "${RUNTIME_RUN_DIR}" "${RUNTIME_NODE_ROOT}"
          aws s3 sync "${CHECKPOINT_S3}" "${LOCAL_CHECKPOINT}" --region "${AWS_REGION}"
          python -c 'from megatron.bridge import AutoBridge; b=AutoBridge.from_hf_pretrained('"'"'Qwen/Qwen3.6-35B-A3B'"'"', trust_remote_code=True); b.export_ckpt('"'"'/host-nvme/test_training/qwen36_swift_r13_hf_export/checkpoint_copy'"'"', '"'"'/host-nvme/test_training/qwen36_swift_r13_hf_export/hf_export'"'"', show_progress=True, strict=False)'
          test -f "${LOCAL_HF_EXPORT}/config.json"
          test -f "${LOCAL_HF_EXPORT}/model.safetensors.index.json" || ls "${LOCAL_HF_EXPORT}"/*.safetensors
          aws s3 sync "${LOCAL_HF_EXPORT}" "${EXPORT_S3}" --region "${AWS_REGION}"
        env:
        - name: AWS_REGION
          value: us-west-2
        - name: AWS_DEFAULT_REGION
          value: us-west-2
        - name: AWS_EC2_METADATA_DISABLED
          value: "true"
        - name: AWS_STS_REGIONAL_ENDPOINTS
          value: regional
        - name: HF_HOME
          value: /host-nvme/test_training/qwen36_swift_r13_hf_export/hf_cache
        - name: TRANSFORMERS_CACHE
          value: /host-nvme/test_training/qwen36_swift_r13_hf_export/hf_cache
        resources:
          requests:
            cpu: "32"
            memory: "512Gi"
            ephemeral-storage: "200Gi"
          limits:
            cpu: "160"
            memory: "1600Gi"
        volumeMounts:
        - name: host-nvme
          mountPath: /host-nvme
      volumes:
      - name: host-nvme
        hostPath:
          path: /opt/dlami/nvme
          type: DirectoryOrCreate
