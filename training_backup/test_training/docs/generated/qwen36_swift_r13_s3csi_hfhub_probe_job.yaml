apiVersion: batch/v1
kind: Job
metadata:
  name: qwen36-swift-r13-s3csi-hfhub-probe-20260608
  namespace: glm51-pd-b200-p1d1
  labels:
    app.kubernetes.io/name: qwen36-swift-r13-s3csi-hfhub-probe
    test-training.verdent.ai/purpose: hfhub-source-probe
spec:
  activeDeadlineSeconds: 2400
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: qwen36-swift-r13-s3csi-hfhub-probe
    spec:
      restartPolicy: Never
      nodeName: hyperpod-i-060621000d6270d47
      containers:
      - name: probe
        image: 763104351884.dkr.ecr.us-east-2.amazonaws.com/pytorch-training:2.8.0-gpu-py312-cu129-ubuntu22.04-ec2-v1.39-soci
        imagePullPolicy: IfNotPresent
        command: ["/bin/bash", "-lc"]
        args:
        - |
          set -euxo pipefail
          S3_ROOT=/s3target
          LOCAL_ROOT=/host-nvme/test_training/qwen36_swift_r13_s3csi_hfhub_probe_20260608
          RUNTIME_RUN_DIR="${LOCAL_ROOT}/runtime_run"
          RUNTIME_NODE_ROOT="${LOCAL_ROOT}/runtime_node0"

          rm -rf "${LOCAL_ROOT}"
          mkdir -p "${RUNTIME_RUN_DIR}/env" "${RUNTIME_NODE_ROOT}" "${LOCAL_ROOT}/hf_cache"
          cp "${S3_ROOT}/env/Megatron-Bridge-v0.4.1-source.tar.gz" "${RUNTIME_RUN_DIR}/env/Megatron-Bridge-v0.4.1-source.tar.gz"
          cp "${S3_ROOT}/artifacts/source/scripts/setup_aws_dlc_bridge_runtime.sh" "${LOCAL_ROOT}/setup_aws_dlc_bridge_runtime.sh"
          bash "${LOCAL_ROOT}/setup_aws_dlc_bridge_runtime.sh" "${RUNTIME_RUN_DIR}" "${RUNTIME_NODE_ROOT}"

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          from huggingface_hub import HfApi, get_hf_file_metadata, hf_hub_download, hf_hub_url
          from huggingface_hub.utils import HfHubHTTPError
          from megatron.bridge import AutoBridge

          model_id = "Qwen/Qwen3.6-35B-A3B"
          cache_dir = "/host-nvme/test_training/qwen36_swift_r13_s3csi_hfhub_probe_20260608/hf_cache"
          api = HfApi()
          info = api.model_info(model_id, files_metadata=True)
          siblings = list(info.siblings or [])
          safetensors = sorted(
              {
                  item.rfilename
                  for item in siblings
                  if item.rfilename.endswith(".safetensors")
              }
          )
          index_path = hf_hub_download(
              repo_id=model_id,
              filename="model.safetensors.index.json",
              cache_dir=cache_dir,
          )
          index_payload = json.loads(Path(index_path).read_text())
          weight_map = index_payload.get("weight_map", {})
          shard_names = sorted(set(weight_map.values()))
          probe_keys = [
              "model.language_model.layers.0.mlp.experts.down_proj",
              "model.language_model.layers.0.mlp.experts.down_proj.weight",
              "model.layers.0.mlp.experts.0.down_proj.weight",
              "model.layers.0.mlp.experts.down_proj",
          ]
          first_shard = shard_names[0] if shard_names else None
          first_shard_head = None
          first_shard_error = None
          if first_shard:
              try:
                  metadata = get_hf_file_metadata(
                      hf_hub_url(repo_id=model_id, filename=first_shard),
                      token=os.getenv("HF_TOKEN"),
                  )
                  first_shard_head = {
                      "etag": metadata.etag,
                      "size": metadata.size,
                  }
              except HfHubHTTPError as exc:
                  first_shard_error = str(exc)

          payload = {
              "model_id": model_id,
              "authoritative_repo_id": getattr(info, "id", None),
              "private": getattr(info, "private", None),
              "gated": getattr(info, "gated", None),
              "can_handle": AutoBridge.can_handle(model_id, trust_remote_code=True),
              "sibling_count": len(siblings),
              "safetensors_sibling_count": len(safetensors),
              "index_weight_count": len(weight_map),
              "index_shard_count": len(shard_names),
              "index_sample_keys": sorted(weight_map.keys())[:30],
              "probe_key_files": {key: weight_map.get(key) for key in probe_keys},
              "first_shard": first_shard,
              "first_shard_head": first_shard_head,
              "first_shard_error": first_shard_error,
          }
          print(json.dumps(payload, sort_keys=True))
          if not payload["can_handle"]:
              raise SystemExit("AutoBridge cannot handle direct HF model id")
          if not shard_names:
              raise SystemExit("HF model index did not expose safetensors shards")
          if first_shard_head is None:
              raise SystemExit(f"Could not HEAD first safetensors shard: {first_shard_error}")
          PY
        env:
        - name: HF_HOME
          value: /host-nvme/test_training/qwen36_swift_r13_s3csi_hfhub_probe_20260608/hf_cache
        - name: TRANSFORMERS_CACHE
          value: /host-nvme/test_training/qwen36_swift_r13_s3csi_hfhub_probe_20260608/hf_cache
        resources:
          requests:
            cpu: "8"
            memory: "64Gi"
            ephemeral-storage: "50Gi"
          limits:
            cpu: "32"
            memory: "256Gi"
        volumeMounts:
        - name: host-nvme
          mountPath: /host-nvme
        - name: verdent-s3
          mountPath: /s3target
          readOnly: true
      volumes:
      - name: host-nvme
        hostPath:
          path: /opt/dlami/nvme
          type: DirectoryOrCreate
      - name: verdent-s3
        persistentVolumeClaim:
          claimName: s3-claim-verdent-qwen36-r13
