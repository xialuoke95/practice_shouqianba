apiVersion: v1
kind: Namespace
metadata:
  name: gpu-sharing-debug
---
apiVersion: batch/v1
kind: Job
metadata:
  name: qwen36-colocated-gpu-smoke
  namespace: gpu-sharing-debug
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: qwen36-colocated-gpu-smoke
    spec:
      restartPolicy: Never
      nodeSelector:
        kubernetes.io/hostname: hyperpod-i-0da428942dd5a9cd9
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: torch-smoke
          image: 288761729453.dkr.ecr.us-east-2.amazonaws.com/sglang-kimik2-detector-patch:20260602085214
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -lc
            - |
              set -euxo pipefail
              nvidia-smi
              python3 - <<'PY'
              import torch
              assert torch.cuda.device_count() == 8, torch.cuda.device_count()
              for i in range(torch.cuda.device_count()):
                  torch.cuda.set_device(i)
                  a = torch.randn((4096, 4096), device="cuda", dtype=torch.bfloat16)
                  b = torch.randn((4096, 4096), device="cuda", dtype=torch.bfloat16)
                  for _ in range(20):
                      c = a @ b
                  torch.cuda.synchronize()
                  print(i, torch.cuda.get_device_name(i), int(torch.cuda.memory_allocated(i)))
              PY
          resources:
            requests:
              cpu: "8"
              memory: 64Gi
              nvidia.com/gpu: "8"
            limits:
              cpu: "16"
              memory: 96Gi
              nvidia.com/gpu: "8"
