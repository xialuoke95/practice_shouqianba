# self define e.g text_classfication
TaskName: "diag_35a3b_no_think_16gpu_te_fused_ce_iters2"
# description for this task
Description: "Diagnostic for 35A3B no-think-sampled: 16 H100, 256K, reference-style TE fused CE, 2 train steps"
# entry point command
Entrypoint: "bash /pfs-verdent/guoyinuo/coding_agent_models/scripts/may/train_diag_16gpu_no_think_sampled_35a3b_te_fused_ce_iters2.sh"
Tags: []
# the code path you want to upload locally
UserCodePath: ""
# remote path mount in training container
RemoteMountCodePath: ""
# user define env var
Envs: []
# queue created under Resource Group, empty as default queue
ResourceQueueID: "q-20260128181205-z9l2h"
# distributed framework, support: TensorFlow PS,PyTorch DDP,Horovod,BytePS
Framework: "PyTorchDDP"
TaskRoleSpecs:
    - RoleName: "worker"
      RoleReplicas: 2
      Flavor: "ml.hpcpni3h.42xlarge"
ActiveDeadlineSeconds: 864000
# enable tensor board or not
EnableTensorBoard: true
TensorBoardStorage:
    Type: "Vepfs"
    SubPath: "guoyinuo/coding_agent_models/output/runs"
# storages
Storages:
    - Type: "Vepfs"
      MountPath: "/pfs-verdent"
      VepfsId: "vepfs-apse1754289b494ca"
      SubPath: ""
ImageUrl: "mlp-ap-southeast-1.cr.bytepluses.com/preset-images/pytorch:2.7.1-cu12.8.1-py3.12-ubuntu22.04"
CacheType: "Cloudfs"
# user define retry options
RetryOptions:
    EnableRetry: false
    MaxRetryTimes: 5
    IntervalSeconds: 120
    PolicySets: []
# diagnosis options
DiagOptions:
    - Name: "EnvironmentalDiagnosis"
      Enable: false
    - Name: "PythonDetection"
      Enable: false
    - Name: "LogDetection"
      Enable: false
    - Name: "VecclHangDetection"
      Enable: false
