apiVersion: v1
kind: ConfigMap
metadata:
  name: nvidia-device-plugin-sharing-config
  namespace: kube-system
data:
  config.yaml: |
    version: v1
    flags:
      migStrategy: none
      failOnInitError: true
      mpsRoot: /run/nvidia/mps
      plugin:
        deviceListStrategy:
          - envvar
        deviceIDStrategy: uuid
    sharing:
      timeSlicing:
        renameByDefault: false
        failRequestsGreaterThanOne: false
        resources:
          - name: nvidia.com/gpu
            replicas: 2
