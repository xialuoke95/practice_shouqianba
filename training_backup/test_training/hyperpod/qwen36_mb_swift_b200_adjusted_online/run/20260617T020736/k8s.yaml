apiVersion: sagemaker.amazonaws.com/v1
kind: HyperPodPyTorchJob
metadata:
  name: qwen36-mb-swift-b200-adjusted-online
  namespace: dolly-probe-training
  labels:
    app.kubernetes.io/name: qwen36-mb-overlay-sft
    app.kubernetes.io/component: train
    verdent.ai/dataset-key: sft-opus-sonnet-swift
    verdent.ai/validation-kind: b200-adjusted-online
spec:
  nprocPerNode: "8"
  replicaSpecs:
    - name: pod
      replicas: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/name: qwen36-mb-overlay-sft
            app.kubernetes.io/component: train
            verdent.ai/dataset-key: sft-opus-sonnet-swift
            verdent.ai/validation-kind: b200-adjusted-online
        spec:
          restartPolicy: Always
          automountServiceAccountToken: false
          nodeSelector:
            node.kubernetes.io/instance-type: ml.p6-b200.48xlarge
            sagemaker.amazonaws.com/node-health-status: Schedulable
          tolerations:
            - key: nvidia.com/gpu
              operator: Exists
              effect: NoSchedule
          containers:
            - name: worker
              image: nvcr.io/nvidia/nemo:26.04.00
              imagePullPolicy: IfNotPresent
              env:
                - name: RUN_ROOT
                  value: "/s3-verdent/test_training/qwen36_megatron_bridge_overlay_sft"
                - name: RUN_ID
                  value: "qwen36-mb-overlay-aligned-fullsft-20260602-211523"
                - name: QWEN36_JOB_NAME
                  value: "qwen36_mb_swift_b200_adjusted_online_20260617"
                - name: KUBE_JOB_NAME
                  value: "qwen36-mb-swift-b200-adjusted-online"
                - name: DATASET_KEY
                  value: "sft_opus_sonnet_swift_mbjson_v2"
                - name: EXPERIMENT_MODE
                  value: "split"
                - name: DIST_MASTER_PORT
                  value: "29687"
                - name: QWEN36_NNODES
                  value: "1"
                - name: QWEN36_NPROC_PER_NODE
                  value: "8"
                - name: GBS
                  value: "16"
                - name: MBS
                  value: "1"
                - name: SEQ_LENGTH
                  value: "128000"
                - name: TP
                  value: "2"
                - name: PP
                  value: "1"
                - name: CP
                  value: "4"
                - name: EP
                  value: "8"
                - name: ETP
                  value: "1"
                - name: RELOAD_CHECKPOINT_SOURCE
                  value: "local_save"
                - name: EPOCHS
                  value: "2"
                - name: TRUNCATION_METHOD
                  value: "left"
                - name: CALCULATE_PER_TOKEN_LOSS
                  value: "true"
                - name: DDP_AVERAGE_IN_COLLECTIVE
                  value: "false"
                - name: DATA_SHARDING
                  value: "false"
                - name: LR
                  value: "1.0e-5"
                - name: MIN_LR
                  value: "1.0e-6"
                - name: WEIGHT_DECAY
                  value: "0.1"
                - name: CLIP_GRAD
                  value: "1.0"
                - name: RECOMPUTE_GRANULARITY
                  value: "full"
                - name: RECOMPUTE_METHOD
                  value: "uniform"
                - name: RECOMPUTE_NUM_LAYERS
                  value: "1"
                - name: MOE_AUX_LOSS_COEFF
                  value: "0.0"
                - name: ATTENTION_BACKEND
                  value: "auto"
                - name: NVTE_FLASH_ATTN
                  value: "1"
                - name: NVTE_FUSED_ATTN
                  value: "1"
                - name: NVTE_UNFUSED_ATTN
                  value: "1"
                - name: PYTORCH_CUDA_ALLOC_CONF
                  value: "expandable_segments:True"
                - name: SKIP_BASELINE_EVAL
                  value: "true"
                - name: TRAIN_ITERS_OVERRIDE
                  value: "2"
                - name: MAX_TRAIN_SAMPLES
                  value: "32"
                - name: EXIT_AFTER_TRAIN
                  value: "true"
              command: ["/bin/bash", "-lc", "export JOB_NAME=\"${QWEN36_JOB_NAME}\" NNODES=\"${QWEN36_NNODES}\" NPROC_PER_NODE=\"${QWEN36_NPROC_PER_NODE}\" \u0026\u0026 /scripts/run_qwen36_overlay_sft_job.sh"]
              securityContext:
                capabilities:
                  add:
                    - IPC_LOCK
              resources:
                requests:
                  cpu: "150"
                  memory: 1800Gi
                  nvidia.com/gpu: "8"
                  vpc.amazonaws.com/efa: "8"
                limits:
                  memory: 1900Gi
                  nvidia.com/gpu: "8"
                  vpc.amazonaws.com/efa: "8"
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
                - name: s3
                  mountPath: /s3-verdent
                - name: scratch
                  mountPath: /scratch
                - name: dshm
                  mountPath: /dev/shm
          volumes:
            - name: scripts
              configMap:
                name: qwen36-mb-overlay-scripts-r14
                defaultMode: 0755
            - name: s3
              persistentVolumeClaim:
                claimName: s3-verdent-tech-use1
            - name: scratch
              emptyDir:
                sizeLimit: 24000Gi
            - name: dshm
              emptyDir:
                medium: Memory
                sizeLimit: 128Gi
  runPolicy:
    cleanPodPolicy: None
    activeDeadlineSeconds: 2592000
    ttlSecondsAfterFinished: 604800
    jobMaxRetryCount: 0